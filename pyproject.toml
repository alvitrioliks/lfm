    "timm>=0.5.4",
    "lpips",
    "accelerate",
    "torchmetrics[image, multimodal]",

    # datasets/diffusiondb/extra_requirements.txt
    "datasets<=3.6.0",
    "Pillow >= 9.4.0",

    # algorithms/gaussian_shading/extra_requirements.txt
    "pycryptodome",
    # "diffusers<= 0.23.1",
