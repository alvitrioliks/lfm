  - stable_signature: # base env
      params:
        device: "cuda:2"



post_extract_metrics:
  # - ExtWm
  - BER  
  - TPR@xFPR:
      report_name: tpr@10e-1fpr
      fpr_rate: 0.1
  - TPR@xFPR:
      report_name: tpr@10e-2fpr
      fpr_rate: 0.01
  - TPR@xFPR:
      report_name: tpr@10e-3fpr
      fpr_rate: 0.001


# post_extract_metrics:
#  - Result:
#     report_name: tpr@10e-2fpr

post_embed_metrics:
  # - PSNR
  - CLIP_IQA
  # - Aesthetic
  # - ImageReward
  # - CLIPScore
  # - BLIP
post_attack_metrics:
  - PSNR
  - SSIM
  - LPIPS
  - CLIP_IQA

datasets:
  - DiffusionDB:
      cache_dir: ./datasets/diffusiondb
      subset: 2m_first_5k
      skip_nsfw: true
      return_prompt: true
      sample_range: [0, 999]
  - MSCOCO:
      cache_dir: ./datasets/mscoco
      split: val
      return_prompt: true
      sample_range: [0, 999]   # Test with 10 images: 0, ..., 9

