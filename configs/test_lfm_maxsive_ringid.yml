algorithms:
  - maxsive:
     params:
       device: "cuda:0"
  - ringid: 
      params:
        device: "cuda:0"

post_extract_metrics:
 - Result:
    report_name: tpr@10e-1fpr
 - Result:
    report_name: tpr@10e-2fpr
 - Result:
    report_name: tpr@10e-3fpr

post_embed_metrics:
  # - PSNR
  - CLIP_IQA
  # - Aesthetic
  # - ImageReward
  # - CLIPScore
  # - BLIP
post_attack_metrics:
  - PSNR
  - SSIM
  - LPIPS
  - CLIP_IQA

datasets:
  - DiffusionDB:
      cache_dir: ./datasets/diffusiondb
      subset: 2m_first_5k
      skip_nsfw: true
      return_prompt: true
      sample_range: [0, 999]
  - MSCOCO:
      cache_dir: ./datasets/mscoco
      split: val
      return_prompt: true
      sample_range: [0, 999]

attacks:
  - latentfrequencymasking:
      report_name: latentfrequencymasking_00
      beta: 0.0
      mask_mode: rand
      mask_radius: 15
      mask_channel: [0, 3]
      device: "cuda:0"
  - latentfrequencymasking:
      report_name: latentfrequencymasking_02
      beta: 0.2
      mask_mode: rand
      mask_radius: 15
      mask_channel: [0, 3]
      device: "cuda:0"
  - latentfrequencymasking:
      report_name: latentfrequencymasking_04
      beta: 0.4
      mask_mode: rand
      mask_radius: 15
      mask_channel: [0, 3]
      device: "cuda:0"
  - latentfrequencymasking:
      report_name: latentfrequencymasking_06
      beta: 0.6
      mask_mode: rand
      mask_radius: 15
      mask_channel: [0, 3]
      device: "cuda:0"
  - latentfrequencymasking:
      report_name: latentfrequencymasking_08
      beta: 0.8
      mask_mode: rand
      mask_radius: 15
      mask_channel: [0, 3]
      device: "cuda:0"

pipeline:
  result_path: ./test_results/test_lfm_maxsive_ringid
  aggregators:
    - CSV:
        table_name: table